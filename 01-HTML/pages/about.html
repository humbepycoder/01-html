<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="A simple webpage demonstrating semantic HTML." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic HTML</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111827;
        --panel: #1f2937;
        --text: #f9fafb;
        --muted: #d1d5db;
        --border: #374151;
        --link: #93c5fd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      header,
      main,
      footer {
        padding: 1rem 1.5rem;
      }

      header,
      footer {
        background: #0b1220;
        border-bottom: 1px solid var(--border);
      }

      footer {
        border-bottom: none;
        border-top: 1px solid var(--border);
      }

      nav ul {
        display: flex;
        gap: 1rem;
        list-style: none;
        padding: 0;
        margin: 0.75rem 0 0;
        flex-wrap: wrap;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      main {
        display: block;
        max-width: 1100px;
        margin: 0 auto;
      }

      aside,
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        margin: 1rem 0;
      }

      h1,
      h2,
      p,
      li {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Introduction to Semantic HTML</h1>
      <nav>
        <ul>
          <li><a href="./../index.html">Home</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <aside>
        <h2>Sidebar</h2>
        <p>
          Use the navigation links above to explore different sections of the
          website.
        </p>
      </aside>
      <section>
        <h2>About This Page</h2>
        <p>
          This page provides information about semantic HTML and its benefits.
        </p>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Semantic HTML Example</p>
    </footer>
  </body>
</html>
